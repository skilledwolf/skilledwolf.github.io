version: "3.9"

services:
  site:
    image: jekyll/jekyll:4
    command: bash -c "bundle install && bundle exec jekyll serve --livereload --drafts --future --force_polling --host 0.0.0.0 --port 4000 --livereload-port 35729"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      JEKYLL_ENV: development

volumes:
  bundle_cache:

